name: GTA 6 Community Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub startet manchmal ein paar Minuten spaeter)
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Starten

permissions:
  contents: write             # damit der Bot state.json zurueckspeichern kann

concurrency:
  group: gta6-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bot ausfuehren
        run: node bot.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

      - name: Stand speichern
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Bot-Stand aktualisiert" && git push)
